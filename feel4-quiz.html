<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feel4 English Quiz</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fc;margin:0;color:#18243a}.app{max-width:540px;margin:auto;padding:24px 18px}header{text-align:center;margin:20px 0 30px}h1{margin:0;color:#2457aa}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card,.choice,.next{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:16px 8px;font-size:16px;cursor:pointer}.card span{display:block;font-size:28px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 20px #172b4d12;margin-top:18px}.choice{display:block;width:100%;text-align:left;margin:10px 0;padding:15px}.choice:disabled{color:#18243a}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.next{background:#2457aa;color:white;width:100%;margin-top:12px}#progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}#bar{height:100%;width:0;background:#2457aa}#feedback{min-height:24px;font-weight:600}.hidden{display:none}small{color:#64748b}button:focus-visible{outline:3px solid #f59e0b}</style></head><body><div class="app"><header><h1>Feel4 English</h1><div class="muted">Collective Nouns Quiz</div></header><section id="home"><p>공부할 주제를 선택하세요.</p><div class="cards"><button class="card" onclick="start('people')"><span>👥</span>People<small>사람</small></button><button class="card" onclick="start('animals')"><span>🐾</span>Animals<small>동물</small></button><button class="card" onclick="start('things')"><span>📦</span>Things<small>사물</small></button></div></section><section id="play" class="panel hidden"><p><b id="cat"></b> <span id="count" style="float:right"></span></p><div id="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" class="next hidden" onclick="advance()">다음 문제</button></section><section id="result" class="panel hidden"><h2>Quiz Complete!</h2><h1 id="score"></h1><p id="review"></p><button class="next" onclick="back()">다른 퀴즈 풀기</button></section></div><script>
const data={people:[['A ___ of players is practicing.','team','crowd','fleet'],['A ___ of students is studying English.','group','herd','swarm'],['A ___ of people is waiting outside.','crowd','pack','bunch'],['The ___ is listening to the music.','audience','flock','school'],['A ___ of singers is performing.','choir','fleet','herd'],['A ___ of sailors is working on the ship.','crew','pride','swarm'],['The ___ of teachers is planning an event.','committee','school','pack'],['A ___ of musicians is playing jazz.','band','colony','herd'],['My ___ is eating dinner together.','family','fleet','school'],['The school ___ is meeting today.','staff','flock','pod']],animals:[['A ___ of birds is flying.','flock','pack','herd'],['A ___ of elephants is walking.','herd','school','swarm'],['A ___ of wolves is hunting.','pack','pod','pride'],['A ___ of fish is swimming.','school','flock','troop'],['A ___ of bees is flying.','swarm','herd','crew'],['A ___ of dolphins is swimming.','pod','pack','choir'],['A ___ of lions is resting.','pride','school','fleet'],['A ___ of cats is sleeping.','clowder','herd','crew'],['A ___ of monkeys is climbing.','troop','pod','swarm'],['A ___ of ants is building a nest.','colony','flock','team']],things:[['A ___ of keys is on the table.','bunch','fleet','herd'],['A ___ of ships is sailing.','fleet','flock','pack'],['A ___ of cards is on the desk.','deck','herd','crowd'],['A ___ of books is on the floor.','stack','pride','pod'],['A ___ of flowers is in the vase.','bunch','crew','school'],['A ___ of grapes is on the plate.','bunch','troop','fleet'],['A ___ of stairs leads upstairs.','flight','swarm','choir'],['A ___ of tools is in the box.','set','flock','pride'],['A ___ of pencils is in the drawer.','box','herd','crew'],['A ___ of islands lies offshore.','group','pack','staff']]};
const $=id=>document.getElementById(id);let questions=[],index=0,score=0,miss=[];function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(c){questions=shuffle(data[c]);index=0;score=0;miss=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.remove('hidden');$('cat').textContent=c.toUpperCase();show()}function show(){let q=questions[index];$('count').textContent=`${index+1} / 10`;$('bar').style.width=`${index*10}%`;$('question').textContent=q[0];$('options').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');shuffle(q.slice(1)).forEach(answer=>{let b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{let ok=answer===q[1];if(ok)score++;else miss.push(`${q[0]} → ${q[1]}`);for(let el of $('options').children){el.disabled=true;if(el.textContent===q[1])el.classList.add('correct');else if(el===b)el.classList.add('wrong')}$('feedback').textContent=ok?'정답입니다! ✓':`정답: ${q[1]}`;$('next').classList.remove('hidden');$('next').textContent=index===9?'결과 보기':'다음 문제'};$('options').appendChild(b)})}function advance(){index++;if(index===10){$('play').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score*10} / 100점`;$('review').textContent=miss.length?'복습할 문제: '+miss.join(' | '):'모두 정답이에요!'}else show()}function back(){$('result').classList.add('hidden');$('home').classList.remove('hidden')}
</script></body></html>
